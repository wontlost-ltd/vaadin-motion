name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0) - must match pom.xml"
        type: string
        required: true
      draft:
        description: "Create GitHub release as draft"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # verify-ci reads the Actions API to confirm this commit's CI conclusion.
  actions: read

jobs:
  # Release gate: Maven Central is irrevocable, so confirm this commit's CI passed and that the
  # release point really is on main (workflow_dispatch can be triggered from any branch).
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert commit is on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=0 2>/dev/null || git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not an ancestor of origin/main — refusing to publish."
            exit 1
          fi
          echo "Commit is on main."

      - name: Assert CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Poll until CI finishes: a tag push triggers this workflow and CI at almost the same
          # moment, so CI is usually still running when we get here.
          #
          # Decision rule: of all ci.yml runs for this commit, look only at the most recent
          # *completed* one.
          #   - latest completed = success        -> pass
          #   - latest completed = anything else  -> fail
          #   - nothing completed yet             -> keep waiting
          #
          # Not "any failure rejects": one bad run would then block the release forever, even
          # after a fix re-runs green. Not "any success passes": an older success would mask a
          # later failure. The latest conclusion avoids both — it is the commit's true state.
          for i in $(seq 1 60); do
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion, run_number}]')
            # Check for in-flight runs first: otherwise "old run succeeded + newer run still
            # going" would be waved through on the stale conclusion, and the in-flight run
            # might yet fail.
            PENDING=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
            LATEST=$(echo "$RUNS" | jq -r '[.[] | select(.status == "completed")] | sort_by(.run_number) | last | .conclusion // "none"')
            echo "attempt $i: pending=$PENDING latest_completed=$LATEST"

            if [[ "$PENDING" -eq 0 ]]; then
              if [[ "$LATEST" == "success" ]]; then
                echo "CI passed for $GITHUB_SHA (no runs in flight)."
                exit 0
              fi
              if [[ "$LATEST" != "none" ]]; then
                echo "::error::Latest CI run for $GITHUB_SHA concluded '$LATEST' — refusing to publish."
                exit 1
              fi
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for CI to complete on $GITHUB_SHA."
          exit 1

  publish:
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -z "${INPUT_VERSION:-}" ]]; then
              echo "::error::Version input is required for manual trigger."
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ ! "$TAG_NAME" =~ ^v[0-9] ]]; then
              echo "::error::Tag must start with v followed by version (e.g. v0.1.0)."
              exit 1
            fi
            VERSION="${TAG_NAME#v}"
          fi

          # Full-string SemVer check, applied on both trigger paths. The anchors matter: without
          # a trailing `$` a tag like "0.1.0-oops" slips through.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: '$VERSION'. Expected X.Y.Z or X.Y.Z-suffix (e.g. 0.1.0, 0.1.0-rc1)."
            exit 1
          fi

          # Verify pom.xml version matches
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$POM_VERSION" != "$VERSION" ]]; then
            echo "::error::pom.xml version ($POM_VERSION) does not match release version ($VERSION)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "Resolved version: $VERSION (matches pom.xml)"

      - name: Publish to Maven Central
        run: mvn -B -ntp clean deploy -Prelease
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: v${{ steps.version.outputs.version }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: |
            target/motion-vaadin-${{ steps.version.outputs.version }}.jar
            target/motion-vaadin-${{ steps.version.outputs.version }}-sources.jar
            target/motion-vaadin-${{ steps.version.outputs.version }}-javadoc.jar
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| Version | \`${VERSION:-n/a}\` |"
            echo "| Tag | \`${TAG_NAME:-n/a}\` |"
            echo "| Maven Central | \`com.wontlost:motion-vaadin:${VERSION:-n/a}\` |"
            echo "| Status | \`${{ job.status }}\` |"
            echo ""
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "Published to [Maven Central](https://central.sonatype.com/artifact/com.wontlost/motion-vaadin/${VERSION})"
              echo ""
              echo "Released to [GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
