name: Secret availability probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report which publishing secrets are visible
        env:
          CU: ${{ secrets.CENTRAL_USERNAME }}
          CP: ${{ secrets.CENTRAL_PASSWORD }}
          GK: ${{ secrets.GPG_PRIVATE_KEY }}
          GP: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Prints only presence and length — never the values themselves.
          for n in CU CP GK GP; do
            v="${!n}"
            if [[ -n "$v" ]]; then echo "$n: present (${#v} chars)"; else echo "$n: MISSING"; fi
          done
