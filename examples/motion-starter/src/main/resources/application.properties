# 演示应用配置。容器内监听 8090，Service 再映射到 80。
server.port=8090
vaadin.launch-browser=false

# 生产模式：使用预构建的前端 bundle，不在运行期启动 Vite dev server。
vaadin.production-mode=true

# Actuator 只暴露健康端点，且拆分 liveness/readiness 供 K8s 分别使用。
# 不暴露 env/beans/heapdump 这类会泄露内部结构的端点。
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# 反向代理（Cloudflare Tunnel -> Traefik）后面，需要按转发头还原真实协议，
# 否则 Vaadin 会用 http 生成 WebSocket URL，导致页面在 https 下连不上 push 通道。
server.forward-headers-strategy=native
